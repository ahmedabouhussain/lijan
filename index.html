<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://media.base44.com/images/public/6a96a0e0cd5dac701b62b7f5/6cc905f53_file_000000006f2c820abccb6782c8b70feb.png/v1/fill/w_192,h_192,al_c,q_90/lijan-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://media.base44.com/images/public/6a96a0e0cd5dac701b62b7f5/6cc905f53_file_000000006f2c820abccb6782c8b70feb.png/v1/fill/w_180,h_180,al_c,q_90/lijan-icon-180.png" />
    <!-- viewport-fit=cover lets the app draw under the iPhone status bar / home indicator;
         index.css absorbs the insets once at the app root so nothing hides behind them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <!-- Noto Naskh Arabic — official Arabic typeface, bundled locally (no external font CDN) -->
    <link rel="preload" as="font" type="font/ttf" href="/fonts/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf" crossorigin />
    <link rel="preload" as="font" type="font/ttf" href="/fonts/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf" crossorigin />
    <meta name="theme-color" content="#8A1538" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Installable app shell (iOS reads these instead of the manifest) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="لجان" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="لِجان™ | LIJAN™ — National Councils & Committees Operating System. Powered by CONNECTION™." />
    <meta property="og:title" content="لِجان™ | LIJAN™" />
    <meta property="og:description" content="National Councils & Committees Operating System — Powered by CONNECTION™" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://media.base44.com/images/public/6a96a0e0cd5dac701b62b7f5/6cc905f53_file_000000006f2c820abccb6782c8b70feb.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>لِجان™ | LIJAN™ — National Councils & Committees OS</title>
  </head>
  <body>
    <!-- Language engine: apply the stored language before first paint so a page
         never flashes the other language or direction. -->
    <script>
      (function () {
        try {
          var l = localStorage.getItem("raqeem_lang") || "ar";
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
